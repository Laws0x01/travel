<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Pacifico&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F6F1E6; --panel: #FFFDF7; --ink: #1B3038; --muted: #6E7B74;
    --line: #E4DAC4; --accent: #0C7489;
    --shadow: 0 1px 2px rgba(27,48,56,.05), 0 10px 30px rgba(27,48,56,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C161C; --panel: #13232B; --ink: #EBEDE0; --muted: #93A39B;
      --line: #27404A; --accent: #4FC1CE; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); font-family: "Public Sans", system-ui, sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 40px)); text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 38px 34px;
  }
  .mark { font-size: 30px; margin-bottom: 10px; }
  h1 { font-family: "Lilita One", "Arial Black", sans-serif; font-weight: 400; font-size: 26px; margin: 0 0 8px; }
  h1 em { font-family: "Pacifico", cursive; font-style: normal; font-weight: 400; color: var(--accent); }
  p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  a {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px; padding: 12px 20px; border-radius: 9px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: #0D1719; } }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<div class="card">
  <div class="mark" aria-hidden="true">&#127965;</div>
  <h1>Washed out to <em>sea</em></h1>

</div>
