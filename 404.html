<title>Not found — The Lawson Beach Index</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F2F6F5; --panel: #FFFFFF; --ink: #152A2E; --muted: #54686C;
    --line: #D9E4E1; --accent: #0B7285;
    --shadow: 0 1px 2px rgba(21,42,46,.06), 0 10px 30px rgba(21,42,46,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1719; --panel: #142225; --ink: #E4EEEA; --muted: #95A8A5;
      --line: #263B3E; --accent: #4CB8C4; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); font-family: "Public Sans", system-ui, sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 40px)); text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 38px 34px;
  }
  .mark { font-size: 30px; margin-bottom: 10px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 26px; margin: 0 0 8px; }
  h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
  p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  a {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px; padding: 12px 20px; border-radius: 9px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: #0D1719; } }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<div class="card">
  <div class="mark" aria-hidden="true">&#127965;</div>
  <h1>Washed out to <em>sea</em></h1>
  <p>This page doesn't exist. The index lives at the front door.</p>
  <a href="/travel/">Back to the gate</a>
</div>
