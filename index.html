<style>
  /* One world, always daylight: sky above, sea at the feet, sand between. */
  :root {
    --sky-top: #C6E6EE; --sky-low: #F2E3C6;
    --sea-top: #4FB0BF; --sea-deep: #0D7488;
    --sand: #F4EDDC; --panel: #FFFDF8;
    --ink: #1D333B; --muted: #6F7D75; --line: #E4D9C2;
    --accent: #0C7489; --sun: #F2B45A; --sun-deep: #D98E2B; --bad: #C14E2E;
    --shadow: 0 1px 2px rgba(29,51,59,.06), 0 12px 34px rgba(29,51,59,.12);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
    background: linear-gradient(180deg, var(--sky-top) 0%, #E3EDDF 42%, var(--sky-low) 62%, var(--sand) 62.2%, var(--sand) 100%);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    position: relative; overflow: hidden;
  }
  .sun {
    position: absolute; right: 10%; top: 7%; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #FBDA8F, var(--sun) 62%, var(--sun-deep));
    box-shadow: 0 0 70px 26px rgba(242, 180, 90, .38);
  }
  .sea {
    position: absolute; left: 0; right: 0; bottom: 0; height: 15vh; min-height: 90px;
    background: linear-gradient(180deg, var(--sea-top), var(--sea-deep));
    overflow: hidden;
  }
  .foam { position: absolute; left: 0; top: 0; width: 200%; height: 30px; display: flex; }
  .foam svg { width: 50%; height: 100%; flex-shrink: 0; }
  .foam2 { top: 12px; opacity: .55; }
  @media (prefers-reduced-motion: no-preference) {
    .foam1 { animation: drift 14s linear infinite; }
    .foam2 { animation: drift 22s linear infinite reverse; }
    @keyframes drift { to { transform: translateX(-50%); } }
    button { transition: background 150ms var(--ease), transform 120ms var(--ease); }
    input[type="password"] { transition: border-color 150ms var(--ease); }
    .card { transition: opacity 260ms var(--ease), transform 260ms var(--ease); }
    @starting-style { .card { opacity: 0; transform: translateY(8px) scale(.98); } }
  }
  .card {
    position: relative; z-index: 1;
    width: min(400px, calc(100vw - 40px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    border-top: 4px solid var(--sea-top);
    box-shadow: var(--shadow); padding: 38px 34px 34px; text-align: center;
  }
  .mark { font-size: 30px; margin-bottom: 10px; }
  h1 {
    font-family: "Lilita One", "Arial Black", sans-serif; font-weight: 400;
    font-size: 27px; margin: 0 0 6px; letter-spacing: .005em;
  }
  h1 em { font-family: "Pacifico", cursive; font-style: normal; font-weight: 400; color: var(--sea-deep); margin: 0 .12em; }
  p { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input[type="password"] {
    font: 500 15px "Public Sans", system-ui, sans-serif;
    color: var(--ink); background: var(--sand);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; text-align: center; letter-spacing: .08em;
  }
  input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: 600 14px "Public Sans", system-ui, sans-serif;
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 12px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .6; cursor: wait; transform: none; }
  @media (hover: hover) and (pointer: fine) {
    button:hover { background: color-mix(in srgb, var(--accent) 84%, var(--ink)); }
    input[type="password"]:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  }
  .remember {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; margin: 2px 0 2px;
  }
  .remember input { accent-color: var(--accent); margin: 0; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 12px; }
  footer {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line);
    font: 500 10.5px "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
</style>

    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const html = new TextDecoder().decode(pt);
    try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch {}
    // blur-masked exit: bridges the gate -> report swap so it reads as one motion.
    // Hidden tabs freeze animations, so never let `finished` block the handoff.
    if (!document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const anim = document.querySelector(".card").animate(
        [{ opacity: 1, transform: "scale(1)", filter: "blur(0)" },
         { opacity: 0, transform: "scale(0.97)", filter: "blur(6px)" }],
        { duration: 200, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "forwards" }
      );
      await Promise.race([anim.finished.catch(() => {}), new Promise(r => setTimeout(r, 400))]);
    }
    document.open(); document.write(html); document.close();
  } catch {
    try { localStorage.removeItem(KEY); } catch {}
    err.textContent = silent ? "" : "That password didn't work. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
    if (!silent) document.getElementById("pw").select();
  }
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if (!pw) { document.getElementById("err").textContent = "Enter the password first."; return; }
  unlock(pw, document.getElementById("remember").checked, false);
});

// remembered on this device? unlock without asking again
(() => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) unlock(saved, true, true);
})();
</script>
