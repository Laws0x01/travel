<title>The Lawson Beach Index</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F2F6F5; --panel: #FFFFFF; --ink: #152A2E; --muted: #54686C;
    --line: #D9E4E1; --accent: #0B7285; --bad: #A33A2E;
    --shadow: 0 1px 2px rgba(21,42,46,.06), 0 10px 30px rgba(21,42,46,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1719; --panel: #142225; --ink: #E4EEEA; --muted: #95A8A5;
      --line: #263B3E; --accent: #4CB8C4; --bad: #E08A7E; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1719; --panel: #142225; --ink: #E4EEEA; --muted: #95A8A5;
    --line: #263B3E; --accent: #4CB8C4; --bad: #E08A7E; --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 40px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 38px 34px 34px; text-align: center;
  }
  .mark { font-size: 30px; margin-bottom: 10px; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 27px; margin: 0 0 6px; letter-spacing: -.01em;
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
  p { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input[type="password"] {
    font: 500 15px "Public Sans", system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 14px; text-align: center; letter-spacing: .08em;
  }
  input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: 600 14px "Public Sans", system-ui, sans-serif;
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 12px; cursor: pointer;
  }
  :root[data-theme="dark"] button { color: #0D1719; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button { color: #0D1719; } }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 12px; }
  footer {
    margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line);
    font: 500 10.5px "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
</style>

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch {
    err.textContent = "That password didn't work. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
    document.getElementById("pw").select();
  }
});
